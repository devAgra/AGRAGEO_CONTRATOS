# Agrageo Suite — Netlify Configuration
[build]
  publish = "frontend"

[[redirects]]
  from = "/pages/login.html"
  to = "/pages/index.html"
  status = 301
[[redirects]]
  from = "/pages/dashboard.html"
  to = "/pages/index.html"
  status = 301
[[redirects]]
  from = "/pages/relatorio.html"
  to = "/pages/index.html"
  status = 301
[[redirects]]
  from = "/pages/municipio.html"
  to = "/pages/index.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
