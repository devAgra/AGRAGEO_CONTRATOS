# ============================================
# HidroScanner — Docker Compose
# Stack completa: Frontend + ETL
# Backend = Supabase (externo)
# ============================================

version: '3.8'

services:
  # ── Frontend (static files via Nginx) ──
  frontend:
    image: nginx:1.25-alpine
    container_name: hidroscanner-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # ── ETL Pipeline (Python scheduler) ──
  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: hidroscanner-etl
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - frontend

