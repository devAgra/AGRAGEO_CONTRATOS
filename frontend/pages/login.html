<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HidroScanner — Plataforma de inteligência geoespacial para identificação de poços irregulares e potencial hidrogeológico">
  <title>HidroScanner — Login</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body {
      background: var(--surface-900);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Animated background */
    .bg-pattern {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-pattern::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 180, 212, 0.08) 0%, transparent 70%);
      top: -200px;
      right: -200px;
      animation: floatBg 15s ease-in-out infinite;
    }

    .bg-pattern::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(45, 212, 191, 0.06) 0%, transparent 70%);
      bottom: -150px;
      left: -150px;
      animation: floatBg 20s ease-in-out infinite reverse;
    }

    @keyframes floatBg {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(40px, -30px); }
    }

    /* Water drop particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(0, 180, 212, 0.3);
      border-radius: 50%;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) scale(1); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(110vh) scale(0.5); opacity: 0; }
    }

    /* Login card */
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 0 24px;
    }

    .login-card {
      background: rgba(15, 22, 41, 0.7);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--border-radius-xl);
      padding: 48px 40px;
      box-shadow: var(--shadow-xl), 0 0 80px rgba(0, 180, 212, 0.05);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--primary-500), var(--accent-400));
      border-radius: var(--border-radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 8px 32px rgba(0, 180, 212, 0.25);
      animation: logoGlow 3s ease-in-out infinite;
    }

    @keyframes logoGlow {
      0%, 100% { box-shadow: 0 8px 32px rgba(0, 180, 212, 0.25); }
      50% { box-shadow: 0 8px 48px rgba(0, 180, 212, 0.4); }
    }

    .login-brand h1 {
      font-size: 1.75rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--text-primary), var(--primary-300));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .login-brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .login-form .form-group {
      margin-bottom: 20px;
    }

    .login-form .form-label {
      font-size: 0.78rem;
      margin-bottom: 6px;
    }

    .login-form .input-wrapper {
      position: relative;
    }

    .login-form .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
    }

    .login-form .form-input {
      padding-left: 42px;
      height: 48px;
      background: rgba(21, 29, 53, 0.8);
      border-radius: 10px;
    }

    .login-form .form-input:focus {
      background: rgba(21, 29, 53, 1);
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 1rem;
      transition: color var(--transition-fast);
    }

    .password-toggle:hover {
      color: var(--text-secondary);
    }

    .login-btn {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary-500), var(--accent-500));
      color: white;
      cursor: pointer;
      transition: all var(--transition-base);
      position: relative;
      overflow: hidden;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 180, 212, 0.35);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    .login-btn .btn-text { transition: opacity 0.2s; }
    .login-btn .btn-spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .login-btn.loading .btn-text { opacity: 0; }
    .login-btn.loading .btn-spinner { opacity: 1; }

    .login-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 10px;
      color: var(--danger-500);
      font-size: 0.85rem;
      animation: shakeX 0.4s ease-in-out;
    }

    .login-error.show { display: flex; }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-4px); }
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .login-footer a {
      color: var(--primary-400);
    }

    /* Version tag */
    .version-tag {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--text-muted);
      opacity: 0.5;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>

  <div class="particles" id="particles"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">💧</div>
        <h1>HidroScanner</h1>
        <p>Inteligência Geoespacial Hidrogeológica</p>
      </div>

      <form class="login-form" id="loginForm" autocomplete="off">
        <div class="login-error" id="loginError">
          <span>⚠️</span>
          <span id="loginErrorText">Credenciais inválidas</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">📧</span>
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="seu@email.com"
              required
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="••••••••••"
              required
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar senha">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">Entrar</span>
          <span class="btn-spinner">
            <span class="spinner" style="width:24px;height:24px;border-width:2px;"></span>
          </span>
        </button>
      </form>

      <div class="login-footer">
        Powered by <a href="#">Agrageo Consultoria</a>
      </div>
    </div>
  </div>

  <div class="version-tag">HidroScanner v1.0 — Mato Grosso Pilot</div>

  <script src="../js/auth.js"></script>
  <script>
    // ── Redirect if already logged in ──
    if (HidroAuth.isAuthenticated()) {
      window.location.href = '/pages/index.html';
    }

    // ── Particle rain effect ──
    const particlesEl = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 8 + 4) + 's';
      p.style.animationDelay = (Math.random() * 5) + 's';
      p.style.width = (Math.random() * 3 + 2) + 'px';
      p.style.height = p.style.width;
      particlesEl.appendChild(p);
    }

    // ── Password toggle ──
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePassword.textContent = isPassword ? '🙈' : '👁️';
    });

    // ── Login form ──
    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const loginErrorText = document.getElementById('loginErrorText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.remove('show');
      loginBtn.classList.add('loading');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        // Simulating network delay
        await new Promise(r => setTimeout(r, 800));
        await HidroAuth.login(email, password);
        window.location.href = '/pages/index.html';
      } catch (err) {
        loginErrorText.textContent = err.message;
        loginError.classList.add('show');
        loginBtn.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
